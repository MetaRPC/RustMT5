site_name: RustMT5 SDK Documentation
site_url: https://metarpc.github.io/RustMT5/
site_description: Complete Rust SDK for MetaTrader 5 trading automation via gRPC

repo_name: MetaRPC/RustMT5
repo_url: https://github.com/MetaRPC/RustMT5
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/language-rust
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  custom_dir: docs/includes

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MetaRPC/RustMT5
      name: RustMT5 on GitHub

extra_css:
  - styles/custom.css

extra_javascript:
  - javascripts/ux.js

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

copyright: >
  Copyright © 2024–2025 MetaRPC. MT5 is a trademark of MetaQuotes Software Corp.
  This documentation is community-maintained and not affiliated with MetaQuotes.

nav:
  - Home: index.md
  - Guides:
      - Getting Started: All_Guides/GETTING_STARTED.md
      - Your First Project: All_Guides/Your_First_Project.md
      - MT5 for Beginners: All_Guides/MT5_For_Beginners.md
      - Project Map: All_Guides/PROJECT_MAP.md
      - Glossary: All_Guides/GLOSSARY.md
      - gRPC Streaming: All_Guides/GRPC_STREAM_MANAGEMENT.md
      - Return Codes: All_Guides/RETURN_CODES_REFERENCE.md
      - ENUMs Reference: All_Guides/ENUMS_USAGE_REFERENCE.md
      - Async Model: All_Guides/SYNC_VS_ASYNC.md
      - Protobuf Inspector: All_Guides/PROTOBUF_INSPECTOR_GUIDE.md
  - API Reference:
      - MT5Account: MT5Account/MT5Account.Master.Overview.md
      - MT5Service: MT5Service/MT5Service.Overview.md
      - MT5Sugar: MT5Sugar/MT5Sugar.Master.Overview.md
  - Strategies:
      - Master Overview: Strategies/Strategies.Master.Overview.md
      - Presets: Strategies/Presets.md
      - Market One-Shot: Strategies/Orchestrators/MarketOneShot.md
      - Bracket + Trailing: Strategies/Orchestrators/BracketTrailing.md
      - Pending Bracket: Strategies/Orchestrators/PendingBracket.md
